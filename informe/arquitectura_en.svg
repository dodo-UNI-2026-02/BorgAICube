<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f5e5a"/>
    </marker>
    <style>
      .caja{fill:#fff;stroke:#5f5e5a;stroke-width:1.5;rx:8}
      .t{font-weight:600;fill:#1f1f1e}.s{fill:#5f5e5a;font-size:11.5px}
      .l{stroke:#5f5e5a;stroke-width:1.6;fill:none;marker-end:url(#f)}
      .d{stroke:#5f5e5a;stroke-width:1.6;fill:none;marker-end:url(#f);marker-start:url(#f)}
    </style>
  </defs>
  <!-- Clientes -->
  <rect class="caja" x="20" y="40" width="190" height="62"/><text class="t" x="35" y="64">Android client</text><text class="s" x="35" y="84">Kotlin · Android · TCP :5000</text>
  <rect class="caja" x="20" y="120" width="190" height="62"/><text class="t" x="35" y="144">Desktop client</text><text class="s" x="35" y="164">Java Swing / terminal · TCP :5000</text>
  <rect class="caja" x="20" y="200" width="190" height="62"/><text class="t" x="35" y="224">Web client</text><text class="s" x="35" y="244">HTML/JS · HTTP :8080</text>
  <!-- Servidor -->
  <rect x="270" y="20" width="320" height="300" rx="12" fill="#f3f7fd" stroke="#2a78d6" stroke-width="1.5"/>
  <text class="t" x="285" y="44">Central server (Linux)</text>
  <rect class="caja" x="290" y="200" width="125" height="62"/><text class="t" x="302" y="224">HTTP server</text><text class="s" x="302" y="244">Java · sockets</text>
  <rect class="caja" x="290" y="62" width="260" height="62"/><text class="t" x="305" y="86">Backend (Java)</text><text class="s" x="305" y="106">thread per client · pool · Correlator</text>
  <rect class="caja" x="430" y="150" width="150" height="150" fill="#fff4ec" stroke="#eb6834"/>
  <text class="t" x="445" y="174">RabbitMQ</text>
  <text class="s" x="445" y="194">cola_modeloA/B</text><text class="s" x="445" y="211">cola_resultadosA/B</text>
  <text class="s" x="445" y="228">cola_validacion</text><text class="s" x="445" y="245">cola_respuestas</text>
  <text class="s" x="445" y="262">cola_historialA/B</text><text class="s" x="445" y="279">heartbeat · logs</text>
  <!-- flechas clientes -->
  <path class="d" d="M210,71 H290"/><path class="d" d="M210,151 H250 V100 H290"/>
  <path class="d" d="M210,231 H290"/><path class="d" d="M352,200 V124"/>
  <path class="d" d="M490,124 V150"/>
  <!-- Nodos -->
  <rect class="caja" x="640" y="30" width="240" height="70" fill="#effaf5" stroke="#1baf7a"/><text class="t" x="655" y="56">AI nodes ×M (Go)</text><text class="s" x="655" y="76">CNN: conv+ReLU+pool → MLP+Softmax</text><text class="s" x="655" y="92">Windows (and Linux in Docker)</text>
  <rect class="caja" x="640" y="130" width="240" height="62"/><text class="t" x="655" y="154">DB node BD2 (Python)</text><text class="s" x="655" y="174">MariaDB · validation · Windows</text>
  <rect class="caja" x="640" y="215" width="240" height="62"/><text class="t" x="655" y="239">DB node BD1 (Python)</text><text class="s" x="655" y="259">PostgreSQL · model A · Windows</text>
  <rect class="caja" x="640" y="300" width="240" height="62"/><text class="t" x="655" y="324">DB node BD3 (Python)</text><text class="s" x="655" y="344">MySQL · model B · Windows</text>
  <path class="d" d="M580,175 H610 V65 H640"/><path class="d" d="M580,190 H625 V161 H640"/>
  <path class="d" d="M580,240 H640"/><path class="d" d="M580,285 H610 V331 H640"/>
  <text class="s" x="20" y="410">Clients ↔ backend: custom TCP sockets, frame [4-byte length][JSON] (no WebSocket).</text>
  <text class="s" x="20" y="430">Backend ↔ AI and DB nodes: RabbitMQ only (AMQP), JSON messages.</text>
  <text class="s" x="20" y="450">3 OS (Linux, Windows, Android) · 3 DBs (PostgreSQL, MariaDB, MySQL) · 4 languages (Java, Python, Go, Kotlin).</text>
</svg>
